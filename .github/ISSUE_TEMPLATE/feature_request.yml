name: Feature request
description: Suggest an improvement with a concrete use case.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What problem would this solve? }
    validations: { required: true }
  - type: textarea
    id: solution
    attributes: { label: Proposed solution }
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
  - type: textarea
    id: usecase
    attributes: { label: Use case }
  - type: input
    id: ecosystem
    attributes: { label: Affected ecosystem }
