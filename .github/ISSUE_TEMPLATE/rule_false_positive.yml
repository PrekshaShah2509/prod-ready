name: Rule false positive
description: Help improve a noisy or incorrect finding.
title: "rule: "
labels:
  - false-positive
body:
  - type: markdown
    attributes:
      value: >-
        Do not include secrets or proprietary source code. Supply a minimal,
        sanitized reproduction.
  - type: input
    id: rule-id
    attributes: { label: Rule ID, placeholder: "e.g. SEC001" }
    validations: { required: true }
  - type: input
    id: cli-version
    attributes: { label: prod-ready version, placeholder: "e.g. 0.1.0" }
    validations: { required: true }
  - type: textarea
    id: finding-details
    attributes:
      label: Finding and why it appears incorrect
      description: Include the sanitized finding output and relevant context.
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproducible example
      description: Include only the smallest sanitized code/config needed to reproduce it.
    validations: { required: true }
  - type: input
    id: framework
    attributes:
      label: Language or framework
