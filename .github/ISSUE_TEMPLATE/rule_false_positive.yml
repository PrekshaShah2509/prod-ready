name: Rule false positive
description: Help improve a noisy or incorrect finding.
title: "rule: "
labels: [false-positive]
body:
  - type: markdown
    attributes:
      value: "Do not include private source code or secrets. Supply a minimal sanitized reproduction."
  - type: input
    id: rule
    attributes: { label: Rule ID, placeholder: "e.g. SEC001" }
    validations: { required: true }
  - type: textarea
    id: finding
    attributes: { label: Detected finding and why it appears incorrect }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Minimal reproducible example }
    validations: { required: true }
  - type: input
    id: framework
    attributes: { label: Language/framework }
  - type: input
    id: version
    attributes: { label: prod-ready version }
